[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "runta-agent-eval"
version = "0.3.9"
description = "Parallel agentic software engineering evaluation platform built on Runta runtimes."
requires-python = ">=3.10"
dependencies = [
  "runta-sdk==0.2.5",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-dotenv>=1.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
]

[project.scripts]
runta-eval = "runta_agent_eval.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
runta_agent_eval = ["static/*", "workers/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
